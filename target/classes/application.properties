spring.application.name=retail-app
server.port=8080

# H2 in-memory database (swap for RDS/MySQL/Postgres in a real deployment)
spring.datasource.url=jdbc:h2:mem:retaildb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always

# Actuator - used by Kubernetes liveness/readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
spring.jpa.defer-datasource-initialization=true
