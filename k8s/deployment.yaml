apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-deployment
  namespace: retail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retail-app
  template:
    metadata:
      labels:
        app: retail-app
    spec:
      containers:
        - name: retail-app
          image: retail-app:local
          ports:
            - containerPort: 8080
